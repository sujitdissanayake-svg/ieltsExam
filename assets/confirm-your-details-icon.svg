<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Confirm your details">
  <defs>
    <linearGradient id="jacket" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Back person -->
  <g filter="url(#shadow)" opacity="0.9">
    <circle cx="42" cy="18" r="10" fill="#f6d6c9" stroke="#475569" stroke-opacity="0.25"/>
    <path d="M28 50c0-10 8-18 18-18s18 8 18 18" fill="url(#shirt)" stroke="#475569" stroke-opacity="0.25"/>
  </g>

  <!-- Front person -->
  <g filter="url(#shadow)">
    <circle cx="24" cy="20" r="11" fill="#f6d6c9" stroke="#475569" stroke-opacity="0.25"/>
    <path d="M6 52c0-12 9-21 20-21s20 9 20 21" fill="url(#jacket)" stroke="#475569" stroke-opacity="0.25"/>
    <path d="M18 34l6 8 6-8" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Green check badge -->
  <g filter="url(#shadow)">
    <rect x="38" y="36" width="22" height="22" rx="4" fill="#16a34a" stroke="#ffffff" stroke-opacity="0.8"/>
    <path d="M44 47l4 4 9-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
