<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test ended</title>
    <link rel="stylesheet" href="styles.css?v=20260308" />
    <script src="ielts-flow-guard.js?v=20260310-3" defer></script>
  </head>
  <body class="listening-ended">
    <main class="listening-ended-main" aria-label="Test ended">
      <div class="listening-ended-wrap">
        <div class="listening-ended-titleRow">
          <span class="listening-ended-icon" aria-hidden="true">
            <span class="listening-ended-iconDisc"></span>
            <span class="listening-ended-iconClock" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21a9 9 0 1 0-9-9 9 9 0 0 0 9 9Z" stroke="currentColor" stroke-width="2" />
                <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
          </span>
          <h1 class="listening-ended-title">Test ended</h1>
        </div>

        <section class="listening-ended-card" role="status" aria-live="polite">
          <div class="listening-ended-body">
            <p>Your test has finished.</p>
            <p>All of your answers have been stored.</p>
            <p>Please wait for further instructions.</p>
          </div>
        </section>
      </div>
    </main>

    <script src="writing-score.js?v=20260609-1"></script>
    <script>
      (function () {
        // Clear the writing timer so a new run starts fresh.
        try {
          window.localStorage.removeItem('ieltsWritingSessionId');
          window.localStorage.removeItem('ieltsWritingStartAt');
          window.localStorage.removeItem('ieltsWritingPart1EndAt');
          window.localStorage.removeItem('ieltsWritingEndAt');
          window.localStorage.removeItem('ieltsWritingWarn45Shown');
          window.localStorage.removeItem('ieltsWritingWarn40Shown');
          window.localStorage.removeItem('ieltsWritingWarn15Shown');
          window.localStorage.removeItem('ieltsWritingWarn5Shown');
          window.localStorage.removeItem('ieltsWritingWarn1Shown');
        } catch (_) {}

        try {
          window.sessionStorage.removeItem('ieltsWritingSessionId');
        } catch (_) {}

        function readValue(key) {
          try {
            var localValue = String(window.localStorage.getItem(key) || '').trim();
            if (localValue) return localValue;
          } catch (_) {}
          try {
            return String(window.sessionStorage.getItem(key) || '').trim();
          } catch (_) {
            return '';
          }
        }

        function normalizePackage(value) {
          var raw = String(value || '').trim();
          return /^(Lite|Basic|Standard|Pro)$/i.test(raw) ? raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase() : '';
        }

        function isLitePaperOneContext() {
          var params = new URLSearchParams(window.location.search || '');
          var mode = String(params.get('testMode') || readValue('ieltsTestMode') || '').trim().toLowerCase();
          var pkg = normalizePackage(params.get('package') || readValue('ieltsMockPackage') || '');
          var paper = String(params.get('paper') || readValue('ieltsMockPaper') || '').trim();
          return mode === 'mock' && pkg === 'Lite' && paper === '1';
        }

        function getCurrentTestMode() {
          var params = new URLSearchParams(window.location.search || '');
          var mode = String(params.get('testMode') || readValue('ieltsTestMode') || '').trim().toLowerCase();
          return mode === 'mock' ? 'mock' : 'free';
        }

        var redirected = false;
        var goToSpeaking = function () {
          if (redirected) return;
          redirected = true;
          var usesHtml = /\.html$/i.test(window.location.pathname || '');
          var target = '';

          if (isLitePaperOneContext()) {
            target = usesHtml ? 'ielts-speaking-lite-paper1.html' : 'ielts-speaking-lite-paper1';
          } else if (getCurrentTestMode() === 'free') {
            // Free mock flow must always land on the speaking-unavailable page.
            target = usesHtml ? 'ielts-speaking.html?testMode=free' : 'ielts-speaking?testMode=free';
          } else {
            target = usesHtml ? 'ielts-speaking.html' : 'ielts-speaking';
          }

          window.location.href = target;
        };

        var fallbackTimeout = window.setTimeout(goToSpeaking, 7000);

        var submitWritingResult = function () {
          try {
            if (window.__ieltsWritingScore && typeof window.__ieltsWritingScore.submitWritingResult === 'function') {
              return window.__ieltsWritingScore.submitWritingResult();
            }
          } catch (_) {}

          return Promise.resolve({ ok: false, skipped: true });
        };

        submitWritingResult()
          .then(function (payload) {
            var result = payload && typeof payload === 'object' ? payload : {};
            var freeMockAttempt = result.freeMockAttempt && typeof result.freeMockAttempt === 'object' ? result.freeMockAttempt : null;
            var shouldRedirect = !!(result.redirectToPackages || (freeMockAttempt && freeMockAttempt.redirectToPackages));
            if (shouldRedirect) {
              var redirectPath = String(result.redirectPath || (freeMockAttempt && freeMockAttempt.redirectPath) || '/packages.html').trim();
              window.location.href = redirectPath;
              return false;
            }
            return true;
          })
          .catch(function () {
            return true;
          })
          .then(function (shouldContinue) {
            if (shouldContinue === false) return;
            window.setTimeout(function () {
              try {
                window.clearTimeout(fallbackTimeout);
              } catch (_) {}
              goToSpeaking();
            }, 1000);
          });
      })();
    </script>
  </body>
</html>
