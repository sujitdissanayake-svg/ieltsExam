<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Mock Test</title>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || '');
        var localHost = /^(localhost|127\.0\.0\.1|::1)$/i.test(String(window.location.hostname || ''));
        var devBypass = localHost && params.get('devBypass') === '1';
        var bypass = devBypass || params.get('bypass') === '1';
        var module = String(params.get('module') || '').trim().toLowerCase() === 'general' ? 'general' : 'academic';

        function withForwardParams(target) {
          ['source', 'package', 'profile', 'auth', 'restart', 'module', 'paper', 'attempt'].forEach(function (key) {
            var value = String(params.get(key) || '').trim();
            if (!value) return;
            target += (target.indexOf('?') === -1 ? '?' : '&') + key + '=' + encodeURIComponent(value);
          });
          return target;
        }

        function openFreeMock() {
          var paper = String(params.get('paper') || '1').replace(/[^0-9]/g, '') || '1';
          var attempt = String(params.get('attempt') || 'initial').toLowerCase() === 'retake' ? 'retake' : 'initial';
          try {
            window.localStorage.setItem('ieltsTestMode', 'free');
            window.localStorage.setItem('ieltsMockPaper', paper);
            window.localStorage.setItem('ieltsTestAttemptType', attempt);
          } catch (_) {}
          var nextTarget = 'ielts-listening.html?bypass=1&module=' + module + '&paper=' + paper + '&attempt=' + attempt;
          window.location.replace(withForwardParams('free-mock-confirm.html?bypass=1&next=' + encodeURIComponent(nextTarget)));
        }

        function redirectToPaidMock(message) {
          window.alert(message || 'Your one Free Mock Test has already been used. Please choose a paid mock test package, which includes a Speaking test.');
          window.location.replace('index.html#mock');
        }

        function readAuth() {
          try {
            var decoded = window.atob(decodeURIComponent(String(params.get('auth') || '')));
            var auth = JSON.parse(decoded);
            var email = String((auth && auth.email) || '').trim();
            var passwordHash = String((auth && auth.passwordHash) || '').trim();
            return email && passwordHash ? { email: email, passwordHash: passwordHash } : null;
          } catch (_) {
            return null;
          }
        }

        if (!bypass) {
          window.location.replace(withForwardParams('free-mock-portal.html'));
          return;
        }

        if (devBypass) {
          openFreeMock();
          return;
        }

        var auth = readAuth();
        if (!auth) {
          window.location.replace(withForwardParams('free-mock-portal.html'));
          return;
        }

        var statusRequestController = typeof AbortController === 'function' ? new AbortController() : null;
        var statusRequestTimeout = window.setTimeout(function () {
          if (statusRequestController) statusRequestController.abort();
        }, 1200);

        fetch('/api/users/free-mock-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(auth),
          signal: statusRequestController ? statusRequestController.signal : undefined,
        })
          .then(function (response) {
            return response.json().catch(function () { return {}; }).then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            var attempt = result && result.data && result.data.freeMockAttempt;
            if (result && result.ok && attempt && attempt.canStart === false) {
              redirectToPaidMock(attempt.message);
              return;
            }
            openFreeMock();
          })
          .catch(function () {
            // Submission endpoints remain authoritative if this availability check cannot be reached.
            openFreeMock();
          })
          .finally(function () {
            window.clearTimeout(statusRequestTimeout);
          });
      })();
    </script>
  </body>
</html>
