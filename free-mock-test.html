<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Mock Test</title>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || '');
        var bypass = params.get('devBypass') === '1' || params.get('bypass') === '1';
        var module = String(params.get('module') || '').trim().toLowerCase() === 'general' ? 'general' : 'academic';

        function withForwardParams(target) {
          ['source', 'package', 'profile', 'auth', 'restart', 'module'].forEach(function (key) {
            var value = String(params.get(key) || '').trim();
            if (!value) return;
            target += (target.indexOf('?') === -1 ? '?' : '&') + key + '=' + encodeURIComponent(value);
          });
          return target;
        }

        if (!bypass) {
          window.location.replace(withForwardParams('free-mock-portal.html'));
          return;
        }

        var nextTarget = 'ielts-academic.html?bypass=1&module=' + module;
        window.location.replace(withForwardParams('free-mock-confirm.html?bypass=1&next=' + encodeURIComponent(nextTarget)));
      })();
    </script>
  </body>
</html>
