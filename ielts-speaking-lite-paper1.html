<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IELTS Test Checks</title>
    <link rel="stylesheet" href="styles.css?v=20260308" />
    <style>
      .speaking-checks-main {
        max-width: 540px;
        margin: 2cm auto 0;
        padding: 10px 14px 12px;
      }

      .speaking-checks-shell {
        border: 1px solid color-mix(in srgb, #1e293b 22%, transparent);
        border-radius: 18px;
        background: #ffffff;
        box-shadow:
          0 24px 44px rgba(15, 23, 42, 0.11),
          inset 0 1px 0 rgba(255, 255, 255, 0.72);
        padding: calc(12px + 1cm) 14px calc(10px + 1cm);
      }

      .speaking-checks-kicker {
        margin: -0.5cm 0 0;
        color: #b91c1c;
        font-size: 22px;
        line-height: 1;
        font-weight: 780;
        letter-spacing: 0.01em;
      }

      .speaking-checks-dayline {
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .speaking-checks-dayline span {
        color: #b91c1c;
        font-size: 24px;
        line-height: 0.9;
        font-weight: 720;
      }

      .speaking-checks-dayline::after {
        content: '';
        flex: 1;
        border-top: 2px solid color-mix(in srgb, #1e293b 35%, transparent);
      }

      .speaking-checks-tabs {
        margin-top: 8px;
        border: 2px solid color-mix(in srgb, #1e293b 30%, transparent);
        border-radius: 8px;
        background: color-mix(in srgb, #ffffff 72%, #dbeafe 28%);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
      }

      .speaking-checks-tab {
        border: 0;
        background: transparent;
        color: #0f172a;
        font-family: "Aptos", "Segoe UI", "Trebuchet MS", sans-serif;
        font-size: 14px;
        font-weight: 670;
        line-height: 1;
        padding: 5px 8px;
        border-radius: 7px;
      }

      .speaking-checks-tab.is-active {
        background: color-mix(in srgb, #93c5fd 45%, #ffffff 55%);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #1d4ed8 22%, transparent);
      }

      .speaking-checks-list {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .speaking-check-card {
        position: relative;
        border: 3px solid #9ea4aa;
        border-radius: 7px;
        background: #ffffff;
        padding: 6px 14px 8px;
      }

      .speaking-check-card-head {
        display: block;
      }

      .speaking-check-card-title {
        margin: 0;
        color: #111827;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 23px;
        line-height: 1;
        font-weight: 500;
      }

      .speaking-check-state {
        margin: 6px 0 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 21px;
        line-height: 1;
        font-weight: 500;
      }

      .speaking-check-card.is-complete .speaking-check-state {
        color: #00a651;
      }

      .speaking-check-card.is-pending .speaking-check-state {
        color: #c8102e;
      }

      .speaking-check-time {
        margin: 8px 0 0;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 19px;
        line-height: 1.1;
        font-weight: 500;
      }

      .speaking-check-time strong {
        margin-left: 9px;
        font-weight: 500;
      }

      .speaking-check-mark {
        position: absolute;
        right: 132px;
        top: 56%;
        transform: translateY(-50%);
        margin: 0;
        color: #00a651;
        font-size: 21px;
        line-height: 1;
        font-weight: 700;
        background: transparent;
        width: auto;
        height: auto;
      }

      .speaking-check-card.is-pending .speaking-check-mark {
        display: none;
      }

      .speaking-check-actions {
        margin-top: calc(10px + 0.5cm);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .speaking-check-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, #1d4ed8 30%, transparent);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }

      .speaking-check-action.primary {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        color: #ffffff;
      }

      .speaking-check-action.secondary {
        background: color-mix(in srgb, #ffffff 88%, #dbeafe 12%);
        color: #0f172a;
      }

      .speaking-check-action:hover {
        filter: brightness(1.03);
      }

      .speaking-check-action:active {
        filter: brightness(0.97);
      }

      .speaking-check-action:focus-visible {
        outline: 3px solid color-mix(in srgb, #2563eb, transparent 50%);
        outline-offset: 2px;
      }

      @media (max-width: 860px) {
        .speaking-checks-main {
          padding: 8px 8px 10px;
        }

        .speaking-checks-shell {
          border-radius: 12px;
          padding: 10px 8px 8px;
        }

        .speaking-checks-kicker {
          font-size: 18px;
        }

        .speaking-checks-dayline {
          margin-top: 6px;
        }

        .speaking-checks-dayline span {
          font-size: 20px;
        }

        .speaking-checks-tab {
          font-size: 12px;
          padding: 4px 7px;
        }

        .speaking-check-card-title {
          font-size: 23px;
        }

        .speaking-check-state {
          margin-top: 4px;
          font-size: 21px;
        }

        .speaking-check-time {
          margin-top: 5px;
          font-size: 19px;
        }

        .speaking-check-mark {
          right: 16px;
          top: 50%;
          font-size: 21px;
        }

        .speaking-check-action {
          width: 100%;
          font-size: 12px;
          min-height: 30px;
        }
      }
    </style>
  </head>
  <body class="speaking-page">
    <header class="academic-topbar" aria-label="IELTS top bar">
      <div class="academic-topbar-inner">
        <img class="academic-topbar-ielts" src="assets/IELTS%20Exam%20logo%202-trim.png?v=20260226b" alt="IELTS" />
        <div class="academic-topbar-partners" aria-label="IELTS partners">
          <img
            class="academic-topbar-partner"
            src="assets/british-council-trim-no-official.png?v=20260226"
            alt="British Council"
            loading="lazy"
          />
          <img class="academic-topbar-partner" src="assets/IDP-trim-no-official.png?v=20260226" alt="IDP" loading="lazy" />
          <span class="academic-topbar-cambridge" aria-label="Cambridge Assessment English">Cambridge Assessment English</span>
        </div>
      </div>
      <div class="academic-topbar-under" aria-hidden="true"></div>
    </header>

    <main class="speaking-checks-main" aria-label="Test checks overview">
      <section class="speaking-checks-shell" aria-label="Completed and non completed tests">
        <h1 class="speaking-checks-kicker">IELTS on Computer</h1>
        <div class="speaking-checks-dayline"><span>Today</span></div>

        <div class="speaking-checks-tabs" role="tablist" aria-label="Summary tabs">
          <button class="speaking-checks-tab" type="button" role="tab" aria-selected="false" tabindex="-1">Test</button>
          <button class="speaking-checks-tab is-active" type="button" role="tab" aria-selected="true">Checks</button>
        </div>

        <section class="speaking-checks-list" aria-label="Module completion list">
          <article class="speaking-check-card is-complete" aria-label="Listening completed">
            <div class="speaking-check-card-head">
              <h2 class="speaking-check-card-title">Listening</h2>
              <p class="speaking-check-state">Completed</p>
            </div>
            <p class="speaking-check-time">Timing:<strong>24 minutes</strong></p>
            <span class="speaking-check-mark" aria-hidden="true">&#10003;</span>
          </article>

          <article class="speaking-check-card is-complete" aria-label="Reading completed">
            <div class="speaking-check-card-head">
              <h2 class="speaking-check-card-title">Reading</h2>
              <p class="speaking-check-state">Completed</p>
            </div>
            <p class="speaking-check-time">Timing:<strong>1 hour</strong></p>
            <span class="speaking-check-mark" aria-hidden="true">&#10003;</span>
          </article>

          <article class="speaking-check-card is-complete" aria-label="Writing completed">
            <div class="speaking-check-card-head">
              <h2 class="speaking-check-card-title">Writing</h2>
              <p class="speaking-check-state">Completed</p>
            </div>
            <p class="speaking-check-time">Timing:<strong>1 hour</strong></p>
            <span class="speaking-check-mark" aria-hidden="true">&#10003;</span>
          </article>

          <article class="speaking-check-card is-pending" aria-label="Speaking not completed">
            <div class="speaking-check-card-head">
              <h2 class="speaking-check-card-title">Speaking</h2>
              <p class="speaking-check-state">Not completed</p>
            </div>
            <p class="speaking-check-time">Timing:<strong>Approximately 13 minutes</strong></p>
            <span class="speaking-check-mark" aria-hidden="true">!</span>
          </article>
        </section>

        <div class="speaking-check-actions" aria-label="Next actions">
          <a class="speaking-check-action primary" data-mock-link href="free-mock-portal.html">Test Taker Portal</a>
          <a class="speaking-check-action secondary" data-portal-link href="packages.html">Mock Test Packages</a>
        </div>
      </section>
    </main>

    <script>
      (function () {
        function readValue(key) {
          try {
            var localValue = String(window.localStorage.getItem(key) || '').trim();
            if (localValue) return localValue;
          } catch (_) {}
          try {
            return String(window.sessionStorage.getItem(key) || '').trim();
          } catch (_) {
            return '';
          }
        }

        function normalizePackage(value) {
          var raw = String(value || '').trim();
          return /^(Lite|Basic|Standard|Pro)$/i.test(raw) ? raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase() : '';
        }

        var usesHtmlRoutes = /\.html$/i.test(window.location.pathname || '');
        var params = new URLSearchParams(window.location.search || '');
        var mode = String(params.get('testMode') || readValue('ieltsTestMode') || '').trim().toLowerCase();
        var pkg = normalizePackage(params.get('package') || readValue('ieltsMockPackage') || '');
        var paper = String(params.get('paper') || readValue('ieltsMockPaper') || '').trim();
        var isLitePaperOne = mode === 'mock' && pkg === 'Lite' && paper === '1';

        if (!isLitePaperOne) {
          try {
            window.location.replace(usesHtmlRoutes ? 'payment-success.html' : 'payment-success');
          } catch (_) {
            window.location.href = usesHtmlRoutes ? 'payment-success.html' : 'payment-success';
          }
          return;
        }

        var mockLink = document.querySelector('[data-mock-link]');
        var portalLink = document.querySelector('[data-portal-link]');

        if (mockLink) {
          mockLink.href = usesHtmlRoutes ? 'free-mock-portal.html' : '/free-mock-portal';
        }

        if (portalLink) {
          portalLink.href = usesHtmlRoutes ? 'packages.html' : 'packages';
        }
      })();
    </script>
  </body>
</html>
